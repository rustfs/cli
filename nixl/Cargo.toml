[package]
name = "rustfs-cli-nixl"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
resolver = "3"
members = ["cuobject-client", "cuobject-client-sys"]
default-members = ["."]

[[bin]]
name = "rc"
path = "src/main.rs"

[features]
cuobject = ["dep:rustfs-cuobject-client"]

[dependencies]
rustfs-cuobject-client = { path = "cuobject-client", features = ["client"], optional = true }
rustfs-cli = { path = "../crates/cli" }
rc-core = { path = "../crates/core" }
rc-s3 = { path = "../crates/s3" }
rustfs-nixl = { git = "https://github.com/rustfs/rustfs", rev = "da6cf7f601f22a486cb18ac5fadf178e601aa6af", features = ["sys"] }
async-trait = "0.1"
base64 = "0.22"
getrandom = "0.4"
http = "1"
tokio = { version = "1", features = ["io-util", "sync", "time"] }
