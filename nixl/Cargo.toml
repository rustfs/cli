[package]
name = "rustfs-cli-nixl"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
resolver = "3"
members = ["rdma-client", "cuobject-client", "cuobject-client-sys"]
default-members = [".", "rdma-client"]

[[bin]]
name = "rc"
path = "src/main.rs"

[features]
default = ["nixl"]
nixl = ["rustfs-rdma-client/nixl"]
cuobject = ["rustfs-rdma-client/cuobject"]

[dependencies]
rustfs-rdma-client = { path = "rdma-client", default-features = false }
rustfs-cli = { path = "../crates/cli" }
rc-s3 = { path = "../crates/s3" }
