[package]
name = "rustfs-cli-rdma"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "3"

[features]
default = []
rdma = ["rustfs-ucx/object", "rustfs-ucx/native"]

[lib]
path = "../vendor/rustfs-ucx/integrations/cli/src/lib.rs"

[[bin]]
name = "rc"
path = "../vendor/rustfs-ucx/integrations/cli/src/main.rs"
required-features = ["rdma"]

[dependencies]
rustfs-cli = { path = "../crates/cli" }
rc-core = { path = "../crates/core" }
rc-s3 = { path = "../crates/s3" }
rustfs-ucx = { path = "../vendor/rustfs-ucx", default-features = false }
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
http = "1"
md-5 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
zeroize = "1"
