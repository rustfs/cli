[workspace]
resolver = "3"
members = ["crates/cli", "crates/core", "crates/s3"]

[workspace.package]
version = "0.1.24"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustfs/cli"
homepage = "https://github.com/rustfs/cli"
description = "A Rust S3 CLI client for S3-compatible object storage"
keywords = ["s3", "cli", "storage", "aws", "object-storage"]
categories = ["command-line-utilities", "filesystem"]

[workspace.dependencies]
# RustFS Internal Crates
rc-core = { path = "./crates/core", version = "0.1.24" }
rc-s3 = { path = "./crates/s3", version = "0.1.24" }
rustfs-cli = { path = "./crates/cli", version = "0.1.24" }

# Async runtime
tokio = { version = "1.49", features = ["full"] }

# AWS SDK
aws-sdk-s3 = { version = "1.119", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-config = { version = "1.8", features = ["behavior-version-latest"] }
aws-credential-types = "1.2"
aws-smithy-types = "1.3"
aws-smithy-runtime-api = "1.9"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
quick-xml = { version = "0.41", features = ["serialize"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Output formatting
indicatif = "0.18"
comfy-table = "7.2"
console = "0.16"

# Utilities
dirs = "6.0"
jiff = { version = "0.2", features = ["serde"] }
humansize = "2.1"
bytes = "1.11"
url = "2.5"
futures = "0.3"
async-trait = "0.1"
mime_guess = "2.0"
glob = "0.3"
shlex = "1.3"

# HTTP client for Admin API
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "rustls-tls-webpki-roots", "json", "stream"] }
aws-sigv4 = "1.2"
http = "1.2"
http-body = "1.0"
http-body-util = "0.1"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2.1"

# Testing
tempfile = "3.24"
mockall = "0.14"
insta = { version = "1.46", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
